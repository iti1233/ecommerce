<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login</title>
  <style>
    :root{--bg:#f4f7fb;--card:#ffffff;--accent:#2563eb;--muted:#6b7280}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 100%)}
    .card{width:360px;background:var(--card);border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.08);padding:28px}
    .brand{font-weight:700;color:var(--accent);font-size:20px;margin-bottom:12px}
    .subtitle{color:var(--muted);font-size:13px;margin-bottom:18px}
    label{display:block;font-size:13px;color:#111827;margin-bottom:6px}
    input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px;box-sizing:border-box}
    .row{margin-bottom:14px}
    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
    .btn{background:var(--accent);color:white;border:none;padding:10px 14px;border-radius:9px;font-weight:600;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .muted{color:var(--muted);font-size:13px}
    .error{color:#b91c1c;font-size:13px;margin-top:8px;display:none}
    .small-btn{background:transparent;border:0;color:var(--accent);cursor:pointer;font-weight:600}
    .show-pass{display:flex;gap:8px;align-items:center}
    footer{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">Admin Panel</div>
    <div class="subtitle">Please sign in with your administrator credentials.</div>

    <form action="adminlogin"  method="post">
      <div class="row">
        <label for="Email">Email</label>
        <input id="email" name="email" type="text" placeholder="Enter email" required />
      </div>

      <div class="row">
        <label for="password">Password</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="password" name="password" type="password" placeholder="Enter password" required />
          <button type="button" id="togglePass" class="small-btn">Show</button>
        </div>
      </div>

      <div class="row actions">
        <div class="muted">Forgot password? <button type="button" id="forgot" class="small-btn">Help</button></div>
        <button class="btn" type="submit">Sign in</button>
      </div>

      <div id="error" class="error">Invalid username or password.</div>
    </form>

    <footer>Demo login: <span style="font-weight:700">admin</span> / <span style="font-weight:700">password123</span></footer>
  </main>

  <script>
    // NOTE: This is a front-end demo only. Do NOT use client-side checks for real authentication.
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const toggle = document.getElementById('togglePass');
    const passwordInput = document.getElementById('password');

    toggle.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggle.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        toggle.textContent = 'Show';
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      const username = form.username.value.trim();
      const password = form.password.value;

      // Demo-only logic: replace with server-side auth
      if (username === 'admin' && password === 'password123') {
        // Simulate successful login
        alert('Login successful — welcome, admin!');
        // In real app: redirect, set secure session cookie from server, etc.
        // window.location.href = '/admin/dashboard';
      } else {
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
